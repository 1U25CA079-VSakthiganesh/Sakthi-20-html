<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Complete a Form</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            width: 600px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        form {
            background-color: white;
            padding: 25px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="email"],
        input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #999;
            border-radius: 4px;
        }

        input[type="checkbox"] {
            margin-right: 8px;
        }

        .checkbox-label {
            display: block;
            font-weight: normal;
            margin: 8px 0;
        }

        .buttons {
            margin-top: 20px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 10px 20px;
            margin-right: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"] {
            background-color: #007bff;
            color: white;
        }

        input[type="reset"] {
            background-color: #777;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Please complete our survey</h1>

    <form method="get" action="survey_data.html">

        <h2>Contact Information</h2>

        <label for="email">Email address:</label>
        <input type="email"
               id="email"
               name="email"
               required
               autofocus>

        <label for="firstName">First name:</label>
        <input type="text"
               id="firstName"
               name="firstName"
               required>

        <label for="lastName">Last name:</label>
        <input type="text"
               id="lastName"
               name="lastName"
               required>


        <h2>Geographic Information</h2>

        <label for="state">State:</label>
        <input type="text"
               id="state"
               name="state"
               required
               pattern="[A-Za-z]{2}"
               placeholder="Two characters"
               title="Enter a two-letter state abbreviation">

        <label for="zip">Zip code:</label>
        <input type="text"
               id="zip"
               name="zip"
               required
               pattern="[0-9]{5}"
               placeholder="Five digits"
               title="Enter exactly five digits">


        <h2>Survey Options</h2>

        <label class="checkbox-label">
            <input type="checkbox" name="source" value="Web Search">
            Web Search
        </label>

        <label class="checkbox-label">
            <input type="checkbox" name="source" value="Facebook">
            Facebook
        </label>

        <label class="checkbox-label">
            <input type="checkbox" name="source" value="Twitter">
            Twitter
        </label>

        <label class="checkbox-label">
            <input type="checkbox" name="source" value="Email message">
            Email message
        </label>


        <div class="buttons">
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </div>

    </form>

</body>
</html>
